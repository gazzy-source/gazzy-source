name: Refresh profile metrics
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/profile.yml'
permissions:
  contents: write
concurrency:
  group: profile-metrics
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check metrics calculations
        run: node --test scripts/metrics.test.mjs
      - name: Fetch public GitHub metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/refresh.mjs
      - name: Commit updated metrics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/metrics.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public profile metrics'
            git push
          fi
